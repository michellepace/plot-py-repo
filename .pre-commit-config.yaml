repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]  # keep md hard line breaks

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.17
    hooks:
      - id: uv-lock

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2 # rules .markdownlint-cli2.yaml
        args: [--fix]         # autofix

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: false
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false

# Notes:
# 1. Order: whitespace → uv-lock → markdownlint-cli2 → ruff-check (auto-fix) → ruff-format → pyright → pytest (slowest last)
# 2. `uv-lock` regenerates uv.lock to match pyproject.toml; any change fails the commit
# 3. Local hooks use `uv run`, so versions come from pyproject.toml
# 4. ruff-check (autofix) precedes ruff-format so formatter runs on the final code
# 5. `--exit-non-zero-on-fix` fails the commit when ruff-check auto-fixes, forcing review
# 6. `pass_filenames: false` runs each tool over the whole codebase, not just staged files
