repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        fail_fast: true
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^\.vscode/         # .vscode/*.json is JSONC
      - id: check-toml

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2       # rules .markdownlint-cli2.yaml
        args: [--fix]

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
        types: [toml]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.1
    hooks:
      - id: uv-lock                 # sync uv.lock ↔ pyproject.toml

  - repo: local
    hooks:
      - id: ruff-check              # lint + autofix first
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyproject]
        pass_filenames: false

      - id: ruff-format             # format last, so it owns final layout
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyproject]
        pass_filenames: false

      - id: pyright                 # ruff lints; pyright type-checks
        name: pyright
        entry: uv run pyright
        language: system
        types_or: [python, pyproject]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types_or: [python, pyproject]
        pass_filenames: false

# Notes (non-obvious)
# 1. `pass_filenames: false` runs hook against the whole project
# 2. types_or [python, pyproject] fires on *.py + pyproject.toml only
