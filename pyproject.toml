[build-system]
# Packaged but never published.
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[project]
name = "plot-py-repo"
version = "0.1.0"
description = "Visualise Python repository evolution through Git history"
readme = "README.md"
authors = [{ name = "Michelle", email = "your.email@example.com" }]
requires-python = ">=3.14"
dependencies = [
  "kaleido>=1.3.0", # WebP export
  "pandas>=3.0.5",  # CSV load, filter, aggregate
  "plotly>=6.9.0",  # chart rendering
]

[project.scripts]
plot-py-repo = "plot_py_repo.cli:main"

[dependency-groups]
dev = ["pre-commit>=4.6.2", "pyright>=1.1.411", "pytest>=9.1.1", "ruff>=0.16.3"]


# TESTING (PYTEST)
# =================================
[tool.pytest.ini_options]
markers = ["slow: tests that generate images (≈3s per image)"]


# TYPE CHECKING (PYRIGHT)
# =================================
[tool.pyright]
typeCheckingMode = "standard" # Keep (not strict!)
pythonVersion = "3.14"
reportUnusedImport = false    # Ruff F401
reportUnusedVariable = false  # Ruff F841
reportDuplicateImport = false # Ruff F811


# LINTING (RUFF)
# =================================
[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [ # ignore incompatible or overly pedantic rules
  "D100",   # Missing docstring in public module
  "D104",   # Missing docstring in public package
  "D203",   # blank line before class docstring (conflicts with D211)
  "D213",   # multi-line summary starts on line 2 (conflicts with D212)
  "COM812", # Trailing comma missing (conflicts with formatter)
  "ISC001", # implicit string concatenation (conflicts with formatter)
  "T201",   # Print found (allow print statements)
  "CPY001", # Missing copyright notice (never published)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "D103",    # Missing docstring in public function
  "PLR2004", # Magic value used in comparison
  "S101",    # Use of assert detected
  "S607",    # Partial executable paths (git commands in tests)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10
